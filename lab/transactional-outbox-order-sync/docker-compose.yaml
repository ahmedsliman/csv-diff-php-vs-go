# Transactional Outbox demo - two PHP order services, each with its own MySQL,
# plus a Go sync worker that relays outbox events between them.
#
# Pattern applied (per the Scott Logic article "Solving Data Consistency in
# Distributed Systems with the Transactional Outbox"):
#   * each service writes its order and the corresponding outbox message in a
#     single local transaction (no dual-write across services)
#   * the Go worker polls each outbox and applies pending events to the peer
#   * receiving side is idempotent (UNIQUE order_number + ON DUPLICATE KEY),
#     so redelivery after a crash is safe
#
# Run:  docker compose up --build
# Then: curl -X POST http://localhost:8000/orders -d '{"order_number":"ORD-1","customer_name":"Alice"}'

services:
  mysql-a:
    image: mysql:8.0
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
      MYSQL_DATABASE: orders_a
    volumes:
      - ./php-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-a-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - outbox-net

  mysql-b:
    image: mysql:8.0
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
      MYSQL_DATABASE: orders_b
    volumes:
      - ./php-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-b-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - outbox-net

  service-a:
    build:
      context: ./php-service
    environment:
      SERVICE_NAME: service-a
      DB_HOST: mysql-a
      DB_PORT: 3306
      DB_NAME: orders_a
      DB_USER: app
      DB_PASSWORD: apppass
    depends_on:
      mysql-a:
        condition: service_healthy
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD", "php", "-r", "file_get_contents('http://127.0.0.1/health') or exit(1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - outbox-net

  service-b:
    build:
      context: ./php-service
    environment:
      SERVICE_NAME: service-b
      DB_HOST: mysql-b
      DB_PORT: 3306
      DB_NAME: orders_b
      DB_USER: app
      DB_PASSWORD: apppass
    depends_on:
      mysql-b:
        condition: service_healthy
    ports:
      - "8001:80"
    healthcheck:
      test: ["CMD", "php", "-r", "file_get_contents('http://127.0.0.1/health') or exit(1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - outbox-net

  sync-worker:
    build:
      context: ./sync-worker
    environment:
      SERVICE_A_BASE_URL: http://service-a
      SERVICE_B_BASE_URL: http://service-b
      POLL_INTERVAL: 3s
    depends_on:
      service-a:
        condition: service_healthy
      service-b:
        condition: service_healthy
    networks:
      - outbox-net

volumes:
  mysql-a-data:
  mysql-b-data:

networks:
  outbox-net:
    driver: bridge
